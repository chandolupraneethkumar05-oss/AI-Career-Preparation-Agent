# Render Blueprint Deployment Configuration
# https://render.com/docs/blueprint-spec

services:
  # Option 1: Unified Docker Service (Frontend + Backend in one container)
  - type: web
    name: ai-career-agent
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:////app/data/career_agent.db
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
