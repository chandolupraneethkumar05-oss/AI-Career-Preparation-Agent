name: AI Career Preparation Agent CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Automated Test Suite
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          pytest -v tests/

      - name: Run Standalone Generative AI Interview Engine Suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          ENVIRONMENT: development
        run: |
          python tests/test_generative_interview_engine.py

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Code Quality & Production Build
  # ----------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Lint & Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint Frontend Code
        run: npm run lint

      - name: Verify Vite Production Build
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Image Build & Compose Validation
  # ----------------------------------------------------------------------------
  docker-build-verification:
    name: Docker Packaging Verification
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: career-agent-backend:ci

      - name: Verify Frontend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: career-agent-frontend:ci

      - name: Verify Unified Production Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: career-agent-unified:ci

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
